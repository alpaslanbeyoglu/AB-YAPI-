<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AB YAPI | Tamamlanan Projelerimiz</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-display {
      font-family: 'Playfair Display', serif;
    }
    
    /* Elegant Print Style rules */
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: white !important;
        color: #0f172a !important;
      }
      .print-container {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .project-card {
        break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #e2e8f0 !important;
        background-color: white !important;
      }
      .project-grid {
        display: grid !important;
        grid-template-cols: repeat(2, minmax(0, 1fr)) !important;
        gap: 1.5rem !important;
      }
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen antialiased flex flex-col">

  <!-- TOP BAR (no-print) -->
  <div class="no-print sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <!-- Back to Home -->
      <a href="./" class="inline-flex items-center gap-2 px-4 py-2 text-xs font-bold text-slate-700 hover:text-indigo-600 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200/60 transition active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Ana Sayfaya Dön
      </a>

      <!-- Print Button -->
      <button onclick="window.print()" class="inline-flex items-center gap-2 px-4 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-xs transition active:scale-95 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
        </svg>
        Raporu Yazdır / PDF Al
      </button>
    </div>
  </div>

  <main class="print-container flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-8">
    
    <!-- PAGE HEADER -->
    <div class="text-center space-y-4">
      <!-- COMPANY LOGO CONTAINER -->
      <div id="companyLogoArea" class="flex justify-center items-center">
        <!-- Dynimc logo from localStorage or fallback to public/logo.svg -->
        <img id="fallbackLogoImg" src="./logo.svg" alt="AB YAPI Logo" class="h-20 object-contain" onerror="this.style.display='none';">
      </div>

      <div class="space-y-2">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 font-display" id="companyTitle">AB YAPI</h1>
        <p class="text-xs sm:text-sm font-mono font-bold uppercase tracking-[0.25em] text-indigo-600" id="companySlogan">GÜVENE YÜKSELEN YAPILAR</p>
      </div>

      <!-- Count Badge -->
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-indigo-100 bg-indigo-50/60 shadow-xs text-xs font-bold text-indigo-700">
        <span class="inline-block w-2 h-2 rounded-full bg-indigo-600 animate-pulse"></span>
        <span id="totalProjectCount">0</span> Tamamlanan Proje / Lokasyon
      </div>
    </div>

    <!-- MANUEL PROJE EKLEME PANELI (no-print) -->
    <div class="no-print max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200/80 p-5 shadow-xs space-y-4">
      <div class="flex items-center gap-2 border-b border-slate-100 pb-2">
        <span class="text-lg">🏗️</span>
        <h3 class="text-sm font-extrabold text-slate-800">Yeni Tamamlanan Proje Ekle</h3>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Proje Adı</label>
          <input type="text" id="newTitle" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-indigo-500 bg-slate-50" placeholder="Örn: Çınar Sk. No: 18">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Sokak & Kapı No</label>
          <input type="text" id="newAddress" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-indigo-500 bg-slate-50" placeholder="Örn: Çınar Sk. No: 18, Kocamustafapaşa">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">İlçe / Şehir</label>
          <input type="text" id="newDistrict" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-indigo-500 bg-slate-50" value="Fatih / İstanbul">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Koordinatlar (Harita Linki İçin)</label>
          <input type="text" id="newCoords" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-indigo-500 bg-slate-50" placeholder="Örn: 41.0047, 28.9337">
        </div>
      </div>
      <button onclick="addNewProject()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-xs transition active:scale-[0.98] cursor-pointer">
        Projeyi Listeye Ekle
      </button>
    </div>

    <!-- SEARCH & FILTERS (no-print) -->
    <div class="no-print max-w-md mx-auto">
      <div class="relative">
        <input type="text" id="searchInput" class="w-full px-4 py-3 text-xs border border-slate-200 rounded-xl outline-none shadow-xs transition focus:ring-2 focus:ring-indigo-500/10 focus:border-indigo-500 bg-white" placeholder="Sokak adı veya kapı numarası yazarak arayın..." onkeyup="filterProjects()">
        <span class="absolute right-3.5 top-3.5 text-slate-400">🔍</span>
      </div>
    </div>

    <!-- PROJECTS GRID -->
    <div class="project-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="projectsContainer">
      <!-- Dynamic list -->
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200/80 py-6 mt-12 text-center text-xs text-slate-400 font-medium">
    <p><span class="text-slate-800 font-bold" id="footerName">AB YAPI A.Ş.</span> © 2026 | Güvenle Geleceğe Uzanan Yapısal Çözümler</p>
  </footer>

  <script>
    // KML'den Çıkarılan Sabit Projeler Listesi
    const initialProjects = [
      { id: 1, title: "AB-YAPI Merkez Ofis", address: "Kocamustafapaşa Mah. İstanbul", district: "Fatih / İstanbul", lat: "41.004813", lng: "28.933724", isOffice: true },
      { id: 2, title: "Çınar Sokak No: 2", address: "Çınar Sk. No: 2, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.004768", lng: "28.933771" },
      { id: 3, title: "Çınar Sokak No: 14", address: "Çınar Sk. No: 14, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.005280", lng: "28.933787" },
      { id: 4, title: "Marmara Caddesi No: 64", address: "Marmara Cd. No: 64, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.002360", lng: "28.932800" },
      { id: 5, title: "Demirci Osman Sokak No: 9", address: "Demirci Osman Sk. No: 9, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.002884", lng: "28.932902" },
      { id: 6, title: "Demirci Osman Sokak No: 23", address: "Demirci Osman Sk. No: 23, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.002637", lng: "28.932571" },
      { id: 7, title: "Demirci Osman Sokak No: 25", address: "Demirci Osman Sk. No: 25, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.002561", lng: "28.932514" },
      { id: 8, title: "Demirci Osman Sokak No: 102", address: "Demirci Osman Sk. No: 102, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.000811", lng: "28.929924" },
      { id: 9, title: "Cambaziye Sokak No: 38", address: "Cambaziye Sk. No: 38, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.002848", lng: "28.932514" },
      { id: 10, title: "Cambaziye Sokak No: 46", address: "Cambaziye Sk. No: 46, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.002655", lng: "28.932836" },
      { id: 11, title: "Tütüncüzade Sokak No: 5", address: "Tütüncüzade Sk. No: 5, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.005046", lng: "28.934234" },
      { id: 12, title: "Kürkçübaşı Çeşmesi Sokak No: 42", address: "Kürkçübaşı Çeşmesi Sk. No: 42, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.005889", lng: "28.943891" },
      { id: 13, title: "Ahmet Hikmet Sokak No: 44", address: "Ahmet Hikmet Sk. No: 44, Fatih Mah.", district: "Fatih / İstanbul", lat: "41.008826", lng: "28.940347" },
      { id: 14, title: "Mecitbey Sokak No: 23", address: "Mecitbey Sk. No: 23, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.009681", lng: "28.929486" },
      { id: 15, title: "Zikirci Sokak No: 18", address: "Zikirci Sk. No: 18, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.009722", lng: "28.928867" },
      { id: 16, title: "Hacıhamza Sokak No: 7", address: "Hacıhamza Sk. No: 7, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.002207", lng: "28.924524" },
      { id: 17, title: "Silivrikapı Caddesi No: 69", address: "Silivrikapı Cd. No: 69, Silivrikapı Mah.", district: "Fatih / İstanbul", lat: "41.006614", lng: "28.925632" },
      { id: 18, title: "Yağhane Sokak Projesi", address: "Yağhane Sk., Silivrikapı Mah.", district: "Fatih / İstanbul", lat: "41.007388", lng: "28.925359" },
      { id: 19, title: "Yediemirler Sokak Projesi", address: "Yediemirler Sk., Silivrikapı Mah.", district: "Fatih / İstanbul", lat: "41.007206", lng: "28.925713" },
      { id: 20, title: "Sebzeci Sokak No: 20", address: "Sebzeci Sk. No: 20, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.004882", lng: "28.930022" },
      { id: 21, title: "Sebzeci Sokak No: 21", address: "Sebzeci Sk. No: 21, Kocamustafapaşa Mah.", district: "Fatih / İstanbul", lat: "41.005019", lng: "28.929852" },
      { id: 22, title: "Ali Fakih Sokak No: 56", address: "Ali Fakih Sk. No: 56, Sümbül Efendi Mah.", district: "Fatih / İstanbul", lat: "41.002099", lng: "28.926823" }
    ];

    let projects = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadProfileAndLogo();
      loadProjects();
    });

    // Load custom logo from localStorage or use fallback SVG from public folder
    function loadProfileAndLogo() {
      const storedStr = localStorage.getItem('ab_yapi_company_profile');
      let profile = {
        companyName: 'AB YAPI',
        slogan: 'Güvene Yükselen Yapılar'
      };

      if (storedStr) {
        try {
          profile = { ...profile, ...JSON.parse(storedStr) };
        } catch (e) {
          console.warn('Profile parse error:', e);
        }
      }

      document.getElementById('companyTitle').innerText = profile.companyName;
      document.getElementById('companySlogan').innerText = profile.slogan;
      document.getElementById('footerName').innerText = profile.companyName + " A.Ş.";

      const logoArea = document.getElementById('companyLogoArea');
      if (profile.logoBase64) {
        logoArea.innerHTML = `
          <div class="h-24 max-w-[240px] flex items-center justify-center bg-white border border-slate-100 p-2.5 rounded-2xl shadow-xs">
            <img src="${profile.logoBase64}" alt="${profile.companyName}" class="max-h-full max-w-full object-contain" />
          </div>
        `;
      } else {
        // Safe relative fallback to our public/logo.svg
        logoArea.innerHTML = `
          <img src="./logo.svg" alt="${profile.companyName} Logo" class="h-24 object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/180x80?text=AB+YAPI';">
        `;
      }
    }

    function loadProjects() {
      const saved = localStorage.getItem('abyapi_completed_projects');
      if (saved) {
        projects = JSON.parse(saved);
      } else {
        projects = [...initialProjects];
        saveProjects();
      }
      renderProjects();
    }

    function saveProjects() {
      localStorage.setItem('abyapi_completed_projects', JSON.stringify(projects));
    }

    function renderProjects() {
      const container = document.getElementById('projectsContainer');
      container.innerHTML = '';

      projects.forEach(p => {
        const isOffice = p.isOffice;
        const badgeClass = isOffice 
          ? 'bg-blue-50 text-blue-700 border-blue-100' 
          : 'bg-emerald-50 text-emerald-700 border-emerald-100';
        const badgeText = isOffice ? '📍 Merkez Ofis' : '✓ Tamamlandı';

        const cardHtml = `
          <div class="project-card bg-white rounded-2xl border border-slate-200/80 p-5 shadow-xs hover:shadow-md transition duration-200 flex flex-col justify-between" data-id="${p.id}">
            <div class="space-y-3">
              <span class="inline-block px-2.5 py-0.5 rounded-full border text-[10px] font-bold tracking-wider uppercase ${badgeClass}">
                ${badgeText}
              </span>
              <h3 class="text-sm font-extrabold text-slate-900 tracking-tight leading-tight">${p.title}</h3>
              <div class="bg-slate-50/80 p-3 rounded-xl border border-slate-100 text-xs text-slate-600 space-y-1.5 leading-relaxed">
                <div class="flex items-start gap-1.5">
                  <span class="text-indigo-600 font-bold shrink-0">📍 Adres:</span>
                  <span>${p.address}</span>
                </div>
                <div class="flex items-start gap-1.5 pt-1.5 border-t border-slate-200/40">
                  <span class="text-slate-500 font-bold shrink-0">🏢 İlçe:</span>
                  <span class="font-semibold text-slate-700">${p.district}</span>
                </div>
              </div>
            </div>
            
            <div class="flex items-center gap-2 mt-4 pt-3 border-t border-slate-100/85">
              <a href="https://maps.google.com/?q=${p.lat},${p.lng}" target="_blank" class="flex-1 text-center py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-[11px] rounded-xl transition border border-slate-200/60 shadow-2xs">
                Haritada Aç ↗
              </a>
              ${!isOffice ? `
                <button onclick="deleteProject(${p.id})" class="no-print p-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl transition border border-rose-100/60 cursor-pointer" title="Projeyi Sil">
                  🗑️
                </button>
              ` : ''}
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      });

      updateProjectCount();
    }

    function addNewProject() {
      const title = document.getElementById('newTitle').value.trim();
      const address = document.getElementById('newAddress').value.trim();
      const district = document.getElementById('newDistrict').value.trim();
      const coords = document.getElementById('newCoords').value.trim();

      if (!title || !address) {
        alert("Lütfen Proje Adı ve Adres alanlarını doldurun!");
        return;
      }

      let lat = "41.0048";
      let lng = "28.9337";

      if (coords && coords.includes(',')) {
        const parts = coords.split(',');
        lat = parts[0].trim();
        lng = parts[1].trim();
      }

      const newObj = {
        id: Date.now(),
        title,
        address,
        district,
        lat,
        lng,
        isOffice: false
      };

      projects.push(newObj);
      saveProjects();
      renderProjects();

      document.getElementById('newTitle').value = '';
      document.getElementById('newAddress').value = '';
      document.getElementById('newCoords').value = '';
    }

    function deleteProject(id) {
      if (confirm("Bu projeyi kaldırmak istediğinize emin misiniz?")) {
        projects = projects.filter(p => p.id !== id);
        saveProjects();
        renderProjects();
      }
    }

    function updateProjectCount() {
      const visibleCards = document.querySelectorAll('.project-card:not([style*="display: none"])');
      document.getElementById('totalProjectCount').innerText = visibleCards.length;
    }

    function filterProjects() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.project-card');

      cards.forEach(card => {
        const cardText = card.innerText.toLowerCase();
        if (cardText.includes(query)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });

      updateProjectCount();
    }
  </script>

</body>
</html>
