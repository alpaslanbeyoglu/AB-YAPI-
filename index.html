<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AB Yapı" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <title>AB Yapı Hesaplayıcı</title>
    <meta name="description" content="AB Yapı kentsel dönüşüm, inşaat maliyet hesaplama, 3D yapı modelleme, mimari kat planı, resmi sözleşme ve inşaat süreç & müşteri ilerleme takip paneli." />
    <meta property="og:title" content="AB Yapı Hesaplayıcı" />
    <meta property="og:description" content="AB Yapı kentsel dönüşüm, inşaat maliyet hesaplama, 3D yapı modelleme, mimari kat planı, resmi sözleşme ve inşaat süreç & müşteri ilerleme takip paneli." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
  </head>
  <body class="font-sans antialiased selection:bg-indigo-500/30 selection:text-indigo-300 min-h-screen bg-slate-50">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 20px; text-align: center;">
        <div style="width: 64px; height: 64px; margin-bottom: 20px; border-radius: 16px; background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"></path>
            <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path>
            <path d="M9 9h1"></path>
            <path d="M9 13h1"></path>
            <path d="M9 17h1"></path>
            <path d="M14 9h1"></path>
            <path d="M14 13h1"></path>
            <path d="M14 17h1"></path>
          </svg>
        </div>
        <h2 style="font-size: 20px; font-weight: 800; margin: 0 0 8px 0; color: #1e293b; letter-spacing: -0.02em;">AB Yapı Kentsel Dönüşüm</h2>
        <p id="ab-loading-msg" style="font-size: 13px; color: #64748b; margin: 0 0 24px 0; font-weight: 500;">Uygulama yükleniyor, lütfen bekleyiniz...</p>
        <div id="ab-loading-bar" style="width: 48px; height: 4px; border-radius: 4px; background: #e2e8f0; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: #4f46e5; border-radius: 4px; position: absolute; animation: abLoading 1.2s infinite ease-in-out;"></div>
        </div>

        <div id="ab-stuck-help" style="display: none; margin-top: 24px; max-width: 320px; text-align: center;">
          <p style="font-size: 12px; color: #64748b; margin-bottom: 12px; line-height: 1.5;">Eski önbellek veya ağ bağlantısı nedeniyle yükleme gecikti.</p>
          <button id="ab-hard-reload-btn" type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 12px; background: #4f46e5; color: #ffffff; font-size: 12px; font-weight: 700; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);">
            Önbelleği Temizle & Başlat
          </button>
        </div>

        <style>
          @keyframes abLoading {
            0% { left: -50%; width: 50%; }
            50% { left: 25%; width: 60%; }
            100% { left: 100%; width: 50%; }
          }
        </style>
      </div>
    </div>
    <script>
      function abHardReset() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        }
        sessionStorage.clear();
        setTimeout(function() {
          window.location.reload(true);
        }, 150);
      }

      var reloadBtn = document.getElementById('ab-hard-reload-btn');
      if (reloadBtn) {
        reloadBtn.addEventListener('click', abHardReset);
      }

      // Watchdog timer: If app hasn't mounted in 3.5 seconds, reveal recovery helper
      setTimeout(function() {
        if (!window.__APP_MOUNTED__) {
          var helpBox = document.getElementById('ab-stuck-help');
          if (helpBox) helpBox.style.display = 'block';
        }
      }, 3500);

      // Global chunk / script error self-healer
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('Loading chunk') !== -1 || e.message.indexOf('dynamically imported module') !== -1 || e.message.indexOf('Failed to fetch') !== -1)) {
          var now = Date.now();
          var lastReload = sessionStorage.getItem('ab_yapi_auto_reload');
          if (!lastReload || (now - parseInt(lastReload, 10)) > 8000) {
            sessionStorage.setItem('ab_yapi_auto_reload', now.toString());
            abHardReset();
          }
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
